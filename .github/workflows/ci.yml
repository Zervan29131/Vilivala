name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  isolation-check:
    name: Reference Isolation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure main site never imports from other/
        run: |
          if grep -rnE "(from|import|require)\s+.*['\"].*other/" frontend/src backend/; then
            echo "ERROR: Found forbidden reference to other/ directory!"
            exit 1
          fi

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: go vet ./...
      - run: go test -v ./...
      - run: go build ./...

  frontend:
    name: Frontend (Vue 3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test
      - run: npm run build

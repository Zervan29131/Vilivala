services:
  mysql:
    image: mysql:8.0
    container_name: vilivala_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-personal_blog}
      MYSQL_USER: ${MYSQL_USER:-bloguser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-blogpass123}
    ports:
      - "3306:3306"
    volumes:
      - vilivala_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass123}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vilivala_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_DSN: "${MYSQL_USER:-bloguser}:${MYSQL_PASSWORD:-blogpass123}@tcp(mysql:3306)/${MYSQL_DATABASE:-personal_blog}?charset=utf8mb4&parseTime=True&loc=Local"
      SERVER_PORT: "8080"
      GIN_MODE: ${GIN_MODE:-release}
      JWT_SECRET: ${JWT_SECRET:-vilivala-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-86400}
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      SITE_TITLE: ${SITE_TITLE:-Zervan的小站}
      SITE_DESCRIPTION: ${SITE_DESCRIPTION:-这是存在于某处的幻想世界 · Zervanのblog}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}
    volumes:
      - vilivala_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: vilivala_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  vilivala_mysql_data:
    driver: local
  vilivala_uploads:
    driver: local

version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: vilivala_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: personal_blog
      MYSQL_USER: bloguser
      MYSQL_PASSWORD: blogpass123
    ports:
      - "3306:3306"
    volumes:
      - vilivala_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass123"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vilivala_mysql_data:
    driver: local
